<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2600 1460">
  <defs>
    <marker id="curveArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3370FF"/>
    </marker>
  </defs>

  <rect width="2600" height="1460" fill="#FFFFFF"/>

  <text x="135" y="108" font-family="Arial, Noto Sans SC, sans-serif" font-size="50" font-weight="700" fill="#1F2329">VIMO 开放能力建设路径</text>
  <text x="135" y="154" font-family="Arial, Noto Sans SC, sans-serif" font-size="22" fill="#646A73">从统一程序入口，演进为多业务复用、持续交付的开放体系</text>

  <line x1="135" y1="1290" x2="2470" y2="1290" stroke="#1F2329" stroke-width="4"/>
  <line x1="135" y1="1290" x2="135" y2="225" stroke="#1F2329" stroke-width="4"/>
  <polygon points="2470,1290 2444,1276 2444,1304" fill="#1F2329"/>
  <polygon points="135,225 121,252 149,252" fill="#1F2329"/>
  <text x="2470" y="1332" text-anchor="end" font-family="Arial, Noto Sans SC, sans-serif" font-size="20" fill="#8F959E">时间</text>
  <text x="76" y="276" text-anchor="middle" font-family="Arial, Noto Sans SC, sans-serif" font-size="20" fill="#646A73">开放能力</text>
  <text x="76" y="304" text-anchor="middle" font-family="Arial, Noto Sans SC, sans-serif" font-size="20" fill="#646A73">复用范围</text>

  <!-- 曲线在每组上下块之间水平穿过，阶段间完成抬升 -->
  <path d="M260 1025 L560 1025 C600 1025 600 840 635 840 L1015 840 C1055 840 1055 625 1090 625 L1470 625 C1510 625 1510 490 1545 490 L1925 490 C1965 490 1965 450 2000 450 L2405 450" fill="none" stroke="#3370FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#curveArrow)"/>

  <!-- 04—05 月 -->
  <line x1="370" y1="1290" x2="370" y2="1110" stroke="#DDE2E8" stroke-width="2" stroke-dasharray="8 10"/>
  <circle cx="370" cy="1290" r="11" fill="#FFFFFF" stroke="#3370FF" stroke-width="5"/>
  <text x="370" y="1350" text-anchor="middle" font-family="Arial, Noto Sans SC, sans-serif" font-size="27" font-weight="700" fill="#1F2329">04—05 月</text>
  <rect x="180" y="740" width="380" height="240" rx="16" fill="#F7F8FA"/>
  <text x="208" y="782" font-family="Arial, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#3370FF">统一调用入口</text>
  <text x="208" y="830" font-family="Arial, Noto Sans SC, sans-serif" font-size="25" font-weight="700" fill="#1F2329">建立程序调用基础</text>
  <text x="208" y="876" font-family="Arial, Noto Sans SC, sans-serif" font-size="18" fill="#4E5969">• 统一素材、面板与实验接口</text>
  <text x="208" y="915" font-family="Arial, Noto Sans SC, sans-serif" font-size="18" fill="#4E5969">• 接入 JWT 与结构化命令</text>
  <text x="208" y="954" font-family="Arial, Noto Sans SC, sans-serif" font-size="18" fill="#4E5969">• 串联权限申请与审批</text>
  <rect x="180" y="1070" width="380" height="90" rx="16" fill="#EAF2FF"/>
  <text x="208" y="1105" font-family="Arial, Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#245BDB">阶段结果</text>
  <text x="208" y="1141" font-family="Arial, Noto Sans SC, sans-serif" font-size="18" font-weight="600" fill="#1F2329">统一入口覆盖个人、脚本与服务账号</text>

  <!-- 05—06 月 -->
  <line x1="825" y1="1290" x2="825" y2="930" stroke="#DDE2E8" stroke-width="2" stroke-dasharray="8 10"/>
  <circle cx="825" cy="1290" r="11" fill="#FFFFFF" stroke="#3370FF" stroke-width="5"/>
  <text x="825" y="1350" text-anchor="middle" font-family="Arial, Noto Sans SC, sans-serif" font-size="27" font-weight="700" fill="#1F2329">05—06 月</text>
  <rect x="635" y="525" width="380" height="270" rx="16" fill="#F7F8FA"/>
  <text x="663" y="567" font-family="Arial, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#3370FF">业务操作闭环</text>
  <text x="663" y="615" font-family="Arial, Noto Sans SC, sans-serif" font-size="25" font-weight="700" fill="#1F2329">承接素材业务操作</text>
  <text x="663" y="661" font-family="Arial, Noto Sans SC, sans-serif" font-size="18" fill="#4E5969">• 开放查询、配置、关联与发布</text>
  <text x="663" y="700" font-family="Arial, Noto Sans SC, sans-serif" font-size="18" fill="#4E5969">• 服务端计算发布变更</text>
  <text x="663" y="739" font-family="Arial, Noto Sans SC, sans-serif" font-size="18" fill="#4E5969">• 按资源与动作控制权限</text>
  <text x="663" y="778" font-family="Arial, Noto Sans SC, sans-serif" font-size="18" fill="#4E5969">• 同步交付 CLI 与 Skill</text>
  <rect x="635" y="885" width="380" height="96" rx="16" fill="#EAF2FF"/>
  <text x="663" y="920" font-family="Arial, Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#245BDB">阶段结果</text>
  <text x="663" y="956" font-family="Arial, Noto Sans SC, sans-serif" font-size="18" font-weight="600" fill="#1F2329">素材查询、配置与发布形成程序闭环</text>

  <!-- 07—08 月 -->
  <line x1="1280" y1="1290" x2="1280" y2="730" stroke="#DDE2E8" stroke-width="2" stroke-dasharray="8 10"/>
  <circle cx="1280" cy="1290" r="11" fill="#FFFFFF" stroke="#3370FF" stroke-width="5"/>
  <text x="1280" y="1350" text-anchor="middle" font-family="Arial, Noto Sans SC, sans-serif" font-size="27" font-weight="700" fill="#1F2329">07—08 月</text>
  <rect x="1090" y="295" width="380" height="285" rx="16" fill="#F7F8FA"/>
  <text x="1118" y="337" font-family="Arial, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#3370FF">多环境与多业务接入</text>
  <text x="1118" y="385" font-family="Arial, Noto Sans SC, sans-serif" font-size="25" font-weight="700" fill="#1F2329">收敛环境与协议差异</text>
  <text x="1118" y="431" font-family="Arial, Noto Sans SC, sans-serif" font-size="18" fill="#4E5969">• 统一国内与海外站点协议</text>
  <text x="1118" y="470" font-family="Arial, Noto Sans SC, sans-serif" font-size="18" fill="#4E5969">• 兼容个人与服务账号</text>
  <text x="1118" y="509" font-family="Arial, Noto Sans SC, sans-serif" font-size="18" fill="#4E5969">• 适配本地脚本与云端 Agent</text>
  <text x="1118" y="548" font-family="Arial, Noto Sans SC, sans-serif" font-size="18" fill="#4E5969">• 按 P0 / P1 / P2 分级管控</text>
  <rect x="1090" y="670" width="380" height="132" rx="16" fill="#EAF2FF"/>
  <text x="1118" y="705" font-family="Arial, Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#245BDB">阶段结果</text>
  <text x="1118" y="741" font-family="Arial, Noto Sans SC, sans-serif" font-size="16" font-weight="600" fill="#1F2329">公共身份链路复用至 5 个模块，</text>
  <text x="1118" y="770" font-family="Arial, Noto Sans SC, sans-serif" font-size="16" font-weight="600" fill="#1F2329">支撑 2 个云端 Agent 与非素材业务接入</text>

  <!-- 09 月 -->
  <line x1="1735" y1="1290" x2="1735" y2="600" stroke="#DDE2E8" stroke-width="2" stroke-dasharray="8 10"/>
  <circle cx="1735" cy="1290" r="11" fill="#FFFFFF" stroke="#3370FF" stroke-width="5"/>
  <text x="1735" y="1350" text-anchor="middle" font-family="Arial, Noto Sans SC, sans-serif" font-size="27" font-weight="700" fill="#1F2329">09 月</text>
  <rect x="1545" y="175" width="380" height="270" rx="16" fill="#F7F8FA"/>
  <text x="1573" y="217" font-family="Arial, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#3370FF">持续交付与可观测</text>
  <text x="1573" y="265" font-family="Arial, Noto Sans SC, sans-serif" font-size="25" font-weight="700" fill="#1F2329">建立交付与观测闭环</text>
  <text x="1573" y="311" font-family="Arial, Noto Sans SC, sans-serif" font-size="18" fill="#4E5969">• Tag 与 Release MR 驱动发布</text>
  <text x="1573" y="350" font-family="Arial, Noto Sans SC, sans-serif" font-size="18" fill="#4E5969">• 分发 CLI、Skill 与双站沙箱</text>
  <text x="1573" y="389" font-family="Arial, Noto Sans SC, sans-serif" font-size="18" fill="#4E5969">• 校验制品、镜像与运行版本</text>
  <text x="1573" y="428" font-family="Arial, Noto Sans SC, sans-serif" font-size="18" fill="#4E5969">• 串联命令、请求、结果与 LogID</text>
  <rect x="1545" y="535" width="380" height="146" rx="16" fill="#EAF2FF"/>
  <text x="1573" y="570" font-family="Arial, Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#245BDB">阶段结果</text>
  <text x="1573" y="606" font-family="Arial, Noto Sans SC, sans-serif" font-size="16" font-weight="600" fill="#1F2329">Q3 记录 313 个调用账号、</text>
  <text x="1573" y="635" font-family="Arial, Noto Sans SC, sans-serif" font-size="16" font-weight="600" fill="#1F2329">累计 608,126 次调用；109 个账号</text>
  <text x="1573" y="664" font-family="Arial, Noto Sans SC, sans-serif" font-size="16" font-weight="600" fill="#1F2329">调用不少于 100 次</text>

  <!-- 10 月至今 -->
  <line x1="2190" y1="1290" x2="2190" y2="555" stroke="#DDE2E8" stroke-width="2" stroke-dasharray="8 10"/>
  <circle cx="2190" cy="1290" r="11" fill="#FFFFFF" stroke="#3370FF" stroke-width="5"/>
  <text x="2190" y="1350" text-anchor="middle" font-family="Arial, Noto Sans SC, sans-serif" font-size="27" font-weight="700" fill="#1F2329">10 月至今</text>
  <rect x="2000" y="170" width="380" height="235" rx="16" fill="#F7F8FA"/>
  <text x="2028" y="212" font-family="Arial, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#3370FF">评测驱动演进</text>
  <text x="2028" y="260" font-family="Arial, Noto Sans SC, sans-serif" font-size="25" font-weight="700" fill="#1F2329">建立评测演进闭环</text>
  <text x="2028" y="306" font-family="Arial, Noto Sans SC, sans-serif" font-size="18" fill="#4E5969">• 固定评测集、评估器与运行版本</text>
  <text x="2028" y="345" font-family="Arial, Noto Sans SC, sans-serif" font-size="18" fill="#4E5969">• 对齐基线与候选的评分、Trace</text>
  <text x="2028" y="384" font-family="Arial, Noto Sans SC, sans-serif" font-size="18" fill="#4E5969">• 单变量迭代配置、Harness 与 Skill</text>
  <rect x="2000" y="495" width="380" height="96" rx="16" fill="#EAF2FF"/>
  <text x="2028" y="530" font-family="Arial, Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#245BDB">阶段结果</text>
  <text x="2028" y="566" font-family="Arial, Noto Sans SC, sans-serif" font-size="17" font-weight="600" fill="#1F2329">支持 Agent / Skill 评测与迭代优化</text>

  <text x="1300" y="1415" text-anchor="middle" font-family="Arial, Noto Sans SC, sans-serif" font-size="18" font-weight="600" fill="#4E5969">统一入口　→　业务操作闭环　→　多环境与多业务复用　→　持续交付与观测　→　评测驱动演进</text>
</svg>
