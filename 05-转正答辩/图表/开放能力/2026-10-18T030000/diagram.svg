<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440">
  <defs>
    <linearGradient id="blueFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FAFF"/>
      <stop offset="1" stop-color="#EEF4FF"/>
    </linearGradient>
    <linearGradient id="greenFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FCF8"/>
      <stop offset="1" stop-color="#ECF7EF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#182230" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F7D50"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="2560" height="1440" fill="#FFFFFF"/>

  <text x="120" y="105" font-family="Noto Sans SC, sans-serif" font-size="48" font-weight="700" fill="#182230">VIMO 开放能力建设路径</text>
  <text x="120" y="150" font-family="Noto Sans SC, sans-serif" font-size="22" fill="#667085">从页面能力程序化，到多业务复用与持续交付</text>

  <rect x="1900" y="82" width="138" height="44" rx="22" fill="#F4F7FC" stroke="#2F5FB3" stroke-width="2"/>
  <text x="1969" y="111" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="600" fill="#2F5FB3">技术建设</text>
  <rect x="2055" y="82" width="138" height="44" rx="22" fill="#F2F9F4" stroke="#2F7D50" stroke-width="2"/>
  <text x="2124" y="111" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="600" fill="#2F7D50">业务变化</text>

  <line x1="120" y1="1280" x2="2440" y2="1280" stroke="#182230" stroke-width="4"/>
  <line x1="120" y1="1280" x2="120" y2="220" stroke="#182230" stroke-width="4"/>
  <polygon points="2440,1280 2416,1268 2416,1292" fill="#182230"/>
  <polygon points="120,220 108,244 132,244" fill="#182230"/>
  <text x="2440" y="1325" text-anchor="end" font-family="Noto Sans SC, sans-serif" font-size="20" fill="#667085">时间</text>
  <text x="70" y="270" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="20" fill="#667085">开放程度</text>
  <text x="70" y="298" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="20" fill="#667085">业务价值</text>

  <path d="M 260 1190 C 430 1165, 525 1090, 655 1035 C 815 965, 940 920, 1090 820 C 1250 715, 1375 665, 1530 590 C 1710 500, 1845 455, 2015 365 C 2150 295, 2250 270, 2375 245" fill="none" stroke="#2F7D50" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- Stage 1 -->
  <line x1="390" y1="1280" x2="390" y2="1125" stroke="#D0D5DD" stroke-width="2" stroke-dasharray="8 10"/>
  <circle cx="390" cy="1280" r="12" fill="#FFFFFF" stroke="#2F7D50" stroke-width="5"/>
  <text x="390" y="1350" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="28" font-weight="700" fill="#182230">04—05 月</text>
  <rect x="190" y="1015" width="400" height="56" rx="28" fill="#F2F4F7"/>
  <text x="390" y="1051" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="21" font-weight="600" fill="#344054">开放入口与权限基础</text>
  <g filter="url(#shadow)">
    <rect x="175" y="735" width="430" height="245" rx="18" fill="url(#blueFill)" stroke="#2F5FB3" stroke-width="3"/>
  </g>
  <text x="205" y="775" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#2F5FB3">技术建设</text>
  <text x="205" y="825" font-family="Noto Sans SC, sans-serif" font-size="28" font-weight="700" fill="#182230">搭建程序调用入口</text>
  <text x="205" y="875" font-family="Noto Sans SC, sans-serif" font-size="20" fill="#344054">OpenAPI 与 CLI 基础能力</text>
  <text x="205" y="912" font-family="Noto Sans SC, sans-serif" font-size="20" fill="#344054">JWT 身份认证</text>
  <text x="205" y="949" font-family="Noto Sans SC, sans-serif" font-size="20" fill="#344054">权限申请与审批链路</text>
  <rect x="175" y="1085" width="430" height="92" rx="18" fill="url(#greenFill)" stroke="#2F7D50" stroke-width="3"/>
  <text x="205" y="1122" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#2F7D50">业务变化</text>
  <text x="205" y="1156" font-family="Noto Sans SC, sans-serif" font-size="21" font-weight="600" fill="#182230">页面操作开始支持程序调用</text>

  <!-- Stage 2 -->
  <line x1="840" y1="1280" x2="840" y2="960" stroke="#D0D5DD" stroke-width="2" stroke-dasharray="8 10"/>
  <circle cx="840" cy="1280" r="12" fill="#FFFFFF" stroke="#2F7D50" stroke-width="5"/>
  <text x="840" y="1350" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="28" font-weight="700" fill="#182230">05—06 月</text>
  <rect x="640" y="850" width="400" height="56" rx="28" fill="#F2F4F7"/>
  <text x="840" y="886" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="21" font-weight="600" fill="#344054">从接口调用到业务任务</text>
  <g filter="url(#shadow)">
    <rect x="625" y="505" width="430" height="310" rx="18" fill="url(#blueFill)" stroke="#2F5FB3" stroke-width="3"/>
  </g>
  <text x="655" y="545" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#2F5FB3">技术建设</text>
  <text x="655" y="595" font-family="Noto Sans SC, sans-serif" font-size="28" font-weight="700" fill="#182230">开放核心业务操作</text>
  <text x="655" y="645" font-family="Noto Sans SC, sans-serif" font-size="20" fill="#344054">查询、配置与分类批量操作</text>
  <text x="655" y="682" font-family="Noto Sans SC, sans-serif" font-size="20" fill="#344054">素材与面板发布</text>
  <text x="655" y="719" font-family="Noto Sans SC, sans-serif" font-size="20" fill="#344054">接口权限之外增加资源范围控制</text>
  <text x="655" y="756" font-family="Noto Sans SC, sans-serif" font-size="20" fill="#344054">业务命令、Skill 与版本更新配套</text>
  <rect x="625" y="925" width="430" height="225" rx="18" fill="url(#greenFill)" stroke="#2F7D50" stroke-width="3"/>
  <text x="655" y="965" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#2F7D50">业务变化</text>
  <text x="655" y="1010" font-family="Noto Sans SC, sans-serif" font-size="23" font-weight="700" fill="#182230">程序可以完成完整业务任务</text>
  <text x="655" y="1055" font-family="Noto Sans SC, sans-serif" font-size="19" fill="#344054">核查约 150 个老特效状态</text>
  <text x="655" y="1092" font-family="Noto Sans SC, sans-serif" font-size="19" fill="#344054">一次移除万余素材分类关联</text>
  <text x="655" y="1127" font-family="Noto Sans SC, sans-serif" font-size="17" fill="#667085">单次案例：人工约 1 天，AI 约 15 分钟</text>

  <!-- Stage 3 -->
  <line x1="1290" y1="1280" x2="1290" y2="800" stroke="#D0D5DD" stroke-width="2" stroke-dasharray="8 10"/>
  <circle cx="1290" cy="1280" r="12" fill="#FFFFFF" stroke="#2F7D50" stroke-width="5"/>
  <text x="1290" y="1350" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="28" font-weight="700" fill="#182230">07—08 月</text>
  <rect x="1090" y="690" width="400" height="56" rx="28" fill="#F2F4F7"/>
  <text x="1290" y="726" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="21" font-weight="600" fill="#344054">多环境复用 · 多业务接入</text>
  <g filter="url(#shadow)">
    <rect x="1075" y="300" width="430" height="355" rx="18" fill="url(#blueFill)" stroke="#2F5FB3" stroke-width="3"/>
  </g>
  <text x="1105" y="340" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#2F5FB3">技术建设</text>
  <text x="1105" y="390" font-family="Noto Sans SC, sans-serif" font-size="28" font-weight="700" fill="#182230">收敛环境与接入差异</text>
  <text x="1105" y="440" font-family="Noto Sans SC, sans-serif" font-size="20" fill="#344054">统一国内、海外站点适配</text>
  <text x="1105" y="477" font-family="Noto Sans SC, sans-serif" font-size="20" fill="#344054">兼容个人账号与服务账号</text>
  <text x="1105" y="514" font-family="Noto Sans SC, sans-serif" font-size="20" fill="#344054">适配本地脚本与云端 Agent</text>
  <text x="1105" y="551" font-family="Noto Sans SC, sans-serif" font-size="20" fill="#344054">统一身份、网络和协议处理</text>
  <text x="1105" y="588" font-family="Noto Sans SC, sans-serif" font-size="20" fill="#344054">按调用主体和风险等级治理权限</text>
  <rect x="1075" y="765" width="430" height="260" rx="18" fill="url(#greenFill)" stroke="#2F7D50" stroke-width="3"/>
  <text x="1105" y="805" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#2F7D50">业务变化</text>
  <text x="1105" y="850" font-family="Noto Sans SC, sans-serif" font-size="23" font-weight="700" fill="#182230">非素材业务快速接入</text>
  <text x="1105" y="895" font-family="Noto Sans SC, sans-serif" font-size="19" fill="#344054">商业化、模板、活动、资源位等</text>
  <text x="1105" y="932" font-family="Noto Sans SC, sans-serif" font-size="19" fill="#344054">复用统一的身份和调用链路</text>
  <text x="1105" y="969" font-family="Noto Sans SC, sans-serif" font-size="19" fill="#344054">新增业务不再重复处理环境差异</text>

  <!-- Stage 4 -->
  <line x1="1740" y1="1280" x2="1740" y2="640" stroke="#D0D5DD" stroke-width="2" stroke-dasharray="8 10"/>
  <circle cx="1740" cy="1280" r="12" fill="#FFFFFF" stroke="#2F7D50" stroke-width="5"/>
  <text x="1740" y="1350" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="28" font-weight="700" fill="#182230">09 月</text>
  <rect x="1540" y="530" width="400" height="56" rx="28" fill="#F2F4F7"/>
  <text x="1740" y="566" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="21" font-weight="600" fill="#344054">交付与维护闭环</text>
  <g filter="url(#shadow)">
    <rect x="1525" y="205" width="430" height="290" rx="18" fill="url(#blueFill)" stroke="#2F5FB3" stroke-width="3"/>
  </g>
  <text x="1555" y="245" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#2F5FB3">技术建设</text>
  <text x="1555" y="295" font-family="Noto Sans SC, sans-serif" font-size="28" font-weight="700" fill="#182230">建立工程化交付体系</text>
  <text x="1555" y="345" font-family="Noto Sans SC, sans-serif" font-size="20" fill="#344054">自动准备和合入 Release MR</text>
  <text x="1555" y="382" font-family="Noto Sans SC, sans-serif" font-size="20" fill="#344054">发布 CLI、增量 Skill 与双站沙箱</text>
  <text x="1555" y="419" font-family="Noto Sans SC, sans-serif" font-size="20" fill="#344054">补齐客户端调用观测与 LogID</text>
  <text x="1555" y="456" font-family="Noto Sans SC, sans-serif" font-size="20" fill="#344054">发布结果分阶段通知和定位</text>
  <rect x="1525" y="605" width="430" height="170" rx="18" fill="url(#greenFill)" stroke="#2F7D50" stroke-width="3"/>
  <text x="1555" y="645" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#2F7D50">业务变化</text>
  <text x="1555" y="690" font-family="Noto Sans SC, sans-serif" font-size="23" font-weight="700" fill="#182230">新能力可以持续交付和维护</text>
  <text x="1555" y="735" font-family="Noto Sans SC, sans-serif" font-size="19" fill="#344054">版本对应关系清楚，调用问题可定位</text>

  <!-- Stage 5 -->
  <line x1="2190" y1="1280" x2="2190" y2="475" stroke="#D0D5DD" stroke-width="2" stroke-dasharray="8 10"/>
  <circle cx="2190" cy="1280" r="12" fill="#FFFFFF" stroke="#2F7D50" stroke-width="5"/>
  <text x="2190" y="1350" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="28" font-weight="700" fill="#182230">10 月至今</text>
  <rect x="1990" y="365" width="400" height="56" rx="28" fill="#F2F4F7"/>
  <text x="2190" y="401" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="21" font-weight="600" fill="#344054">进入常态化迭代</text>
  <g filter="url(#shadow)">
    <rect x="1975" y="145" width="430" height="185" rx="18" fill="url(#blueFill)" stroke="#2F5FB3" stroke-width="3"/>
  </g>
  <text x="2005" y="185" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#2F5FB3">技术建设</text>
  <text x="2005" y="235" font-family="Noto Sans SC, sans-serif" font-size="28" font-weight="700" fill="#182230">持续完善开放体系</text>
  <text x="2005" y="280" font-family="Noto Sans SC, sans-serif" font-size="20" fill="#344054">补充业务命令，修正运行边界</text>
  <text x="2005" y="314" font-family="Noto Sans SC, sans-serif" font-size="20" fill="#344054">持续优化发布和使用体验</text>
  <rect x="1975" y="440" width="430" height="170" rx="18" fill="url(#greenFill)" stroke="#2F7D50" stroke-width="3"/>
  <text x="2005" y="480" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#2F7D50">业务变化</text>
  <text x="2005" y="525" font-family="Noto Sans SC, sans-serif" font-size="23" font-weight="700" fill="#182230">开放能力承接日常业务需求</text>
  <text x="2005" y="570" font-family="Noto Sans SC, sans-serif" font-size="19" fill="#344054">新操作沿既有接入与发布链路持续交付</text>

  <text x="120" y="1400" font-family="Noto Sans SC, sans-serif" font-size="16" fill="#98A2B3">注：案例数据仅对应已核实任务，不外推为平均提效。</text>
</svg>
