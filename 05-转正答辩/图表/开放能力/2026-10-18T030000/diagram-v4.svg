<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2600 1460">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#1F2937" flood-opacity="0.08"/>
    </filter>
    <marker id="curveArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3370FF"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="2600" height="1460" fill="#FFFFFF"/>

  <!-- 标题 -->
  <text x="135" y="108" font-family="Noto Sans SC, sans-serif" font-size="50" font-weight="700" fill="#1F2329">VIMO 开放能力建设路径</text>
  <text x="135" y="154" font-family="Noto Sans SC, sans-serif" font-size="22" fill="#646A73">从统一程序入口，演进为多业务复用、持续交付的开放体系</text>

  <!-- 坐标轴 -->
  <line x1="135" y1="1290" x2="2470" y2="1290" stroke="#1F2329" stroke-width="4"/>
  <line x1="135" y1="1290" x2="135" y2="225" stroke="#1F2329" stroke-width="4"/>
  <polygon points="2470,1290 2444,1276 2444,1304" fill="#1F2329"/>
  <polygon points="135,225 121,252 149,252" fill="#1F2329"/>
  <text x="2470" y="1332" text-anchor="end" font-family="Noto Sans SC, sans-serif" font-size="20" fill="#8F959E">时间</text>
  <text x="76" y="276" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="20" fill="#646A73">开放能力</text>
  <text x="76" y="304" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="20" fill="#646A73">复用范围</text>

  <!-- 能力曲线 -->
  <path d="M260 1175 C440 1138, 530 1070, 675 1000 C840 920, 955 840, 1120 750 C1290 658, 1420 580, 1580 500 C1750 416, 1885 362, 2050 292 C2195 230, 2295 210, 2405 198" fill="none" stroke="#3370FF" stroke-width="8" stroke-linecap="round" marker-end="url(#curveArrow)"/>

  <!-- 阶段 1：动作在上 -->
  <line x1="370" y1="1290" x2="370" y2="1150" stroke="#DDE2E8" stroke-width="2" stroke-dasharray="8 10"/>
  <circle cx="370" cy="1290" r="11" fill="#FFFFFF" stroke="#3370FF" stroke-width="5"/>
  <text x="370" y="1350" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="27" font-weight="700" fill="#1F2329">04—05 月</text>
  <g filter="url(#softShadow)">
    <rect x="180" y="720" width="380" height="300" rx="18" fill="#F7F8FA"/>
  </g>
  <rect x="180" y="720" width="8" height="300" rx="4" fill="#3370FF"/>
  <text x="212" y="760" font-family="Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#3370FF">统一调用入口</text>
  <text x="212" y="808" font-family="Noto Sans SC, sans-serif" font-size="26" font-weight="700" fill="#1F2329">建立程序调用基础</text>
  <text x="212" y="856" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#4E5969">将素材、面板、实验能力整理为接口</text>
  <text x="212" y="895" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#4E5969">接入 JWT 身份认证与结构化命令</text>
  <text x="212" y="934" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#4E5969">打通接口权限申请和审批链路</text>
  <rect x="180" y="1050" width="380" height="115" rx="16" fill="#EAF2FF"/>
  <text x="208" y="1084" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#245BDB">阶段结果</text>
  <text x="208" y="1122" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="600" fill="#1F2329">形成覆盖个人、脚本和服务账号的</text>
  <text x="208" y="1152" font-family="Noto Sans SC, sans-serif" font-size="19" font-weight="600" fill="#1F2329">统一程序调用入口</text>

  <!-- 阶段 2 -->
  <line x1="825" y1="1290" x2="825" y2="990" stroke="#DDE2E8" stroke-width="2" stroke-dasharray="8 10"/>
  <circle cx="825" cy="1290" r="11" fill="#FFFFFF" stroke="#3370FF" stroke-width="5"/>
  <text x="825" y="1350" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="27" font-weight="700" fill="#1F2329">05—06 月</text>
  <g filter="url(#softShadow)">
    <rect x="635" y="485" width="380" height="335" rx="18" fill="#F7F8FA"/>
  </g>
  <rect x="635" y="485" width="8" height="335" rx="4" fill="#3370FF"/>
  <text x="667" y="525" font-family="Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#3370FF">业务操作闭环</text>
  <text x="667" y="573" font-family="Noto Sans SC, sans-serif" font-size="26" font-weight="700" fill="#1F2329">完整承接素材业务操作</text>
  <text x="667" y="621" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#4E5969">开放查询、配置、分类关系和发布</text>
  <text x="667" y="660" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#4E5969">服务端按业务目标计算发布变更</text>
  <text x="667" y="699" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#4E5969">按面板、素材类型和动作限制范围</text>
  <text x="667" y="738" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#4E5969">CLI、Skill 与版本更新配套交付</text>
  <rect x="635" y="850" width="380" height="155" rx="16" fill="#EAF2FF"/>
  <text x="663" y="884" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#245BDB">阶段结果</text>
  <text x="663" y="922" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="600" fill="#1F2329">约 150 个老特效状态批量核查</text>
  <text x="663" y="955" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="600" fill="#1F2329">一次任务移除万余素材分类关联</text>
  <text x="663" y="986" font-family="Noto Sans SC, sans-serif" font-size="16" fill="#646A73">单次案例：人工约 1 天，AI 约 15 分钟</text>

  <!-- 阶段 3 -->
  <line x1="1280" y1="1290" x2="1280" y2="810" stroke="#DDE2E8" stroke-width="2" stroke-dasharray="8 10"/>
  <circle cx="1280" cy="1290" r="11" fill="#FFFFFF" stroke="#3370FF" stroke-width="5"/>
  <text x="1280" y="1350" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="27" font-weight="700" fill="#1F2329">07—08 月</text>
  <g filter="url(#softShadow)">
    <rect x="1090" y="260" width="380" height="365" rx="18" fill="#F7F8FA"/>
  </g>
  <rect x="1090" y="260" width="8" height="365" rx="4" fill="#3370FF"/>
  <text x="1122" y="300" font-family="Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#3370FF">多环境与多业务接入</text>
  <text x="1122" y="348" font-family="Noto Sans SC, sans-serif" font-size="26" font-weight="700" fill="#1F2329">收敛环境与协议差异</text>
  <text x="1122" y="396" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#4E5969">统一国内与海外站点适配</text>
  <text x="1122" y="435" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#4E5969">兼容个人账号与服务账号</text>
  <text x="1122" y="474" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#4E5969">覆盖本地脚本与云端 Agent</text>
  <text x="1122" y="513" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#4E5969">按 P0 / P1 / P2 治理开放风险</text>
  <text x="1122" y="552" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#4E5969">身份、网络、协议统一由公共层承接</text>
  <rect x="1090" y="655" width="380" height="155" rx="16" fill="#EAF2FF"/>
  <text x="1118" y="689" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#245BDB">阶段结果</text>
  <text x="1118" y="727" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="600" fill="#1F2329">公共身份组件复用至 5 个业务模块</text>
  <text x="1118" y="760" font-family="Noto Sans SC, sans-serif" font-size="17" font-weight="600" fill="#1F2329">2 个云端 Agent 复用免登录执行链路</text>
  <text x="1118" y="791" font-family="Noto Sans SC, sans-serif" font-size="16" fill="#646A73">商业化、模板等非素材业务快速接入</text>

  <!-- 阶段 4 -->
  <line x1="1735" y1="1290" x2="1735" y2="635" stroke="#DDE2E8" stroke-width="2" stroke-dasharray="8 10"/>
  <circle cx="1735" cy="1290" r="11" fill="#FFFFFF" stroke="#3370FF" stroke-width="5"/>
  <text x="1735" y="1350" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="27" font-weight="700" fill="#1F2329">09 月</text>
  <g filter="url(#softShadow)">
    <rect x="1545" y="150" width="380" height="345" rx="18" fill="#F7F8FA"/>
  </g>
  <rect x="1545" y="150" width="8" height="345" rx="4" fill="#3370FF"/>
  <text x="1577" y="190" font-family="Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#3370FF">持续交付与可观测</text>
  <text x="1577" y="238" font-family="Noto Sans SC, sans-serif" font-size="26" font-weight="700" fill="#1F2329">建立交付与观测闭环</text>
  <text x="1577" y="286" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#4E5969">由 Tag 和 Release MR 驱动发布</text>
  <text x="1577" y="325" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#4E5969">分发 CLI、增量 Skill 与双站沙箱</text>
  <text x="1577" y="364" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#4E5969">校验制品、镜像与运行版本一致性</text>
  <text x="1577" y="403" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#4E5969">关联命令、请求、结果与 LogID</text>
  <rect x="1545" y="525" width="380" height="145" rx="16" fill="#EAF2FF"/>
  <text x="1573" y="559" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#245BDB">阶段结果</text>
  <text x="1573" y="597" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="600" fill="#1F2329">Q3 记录 313 个调用账号</text>
  <text x="1573" y="630" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="600" fill="#1F2329">累计 608,126 次调用</text>
  <text x="1573" y="658" font-family="Noto Sans SC, sans-serif" font-size="16" fill="#646A73">109 个账号调用不少于 100 次</text>

  <!-- 阶段 5 -->
  <line x1="2190" y1="1290" x2="2190" y2="470" stroke="#DDE2E8" stroke-width="2" stroke-dasharray="8 10"/>
  <circle cx="2190" cy="1290" r="11" fill="#FFFFFF" stroke="#3370FF" stroke-width="5"/>
  <text x="2190" y="1350" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="27" font-weight="700" fill="#1F2329">10 月至今</text>
  <g filter="url(#softShadow)">
    <rect x="2000" y="165" width="380" height="245" rx="18" fill="#F7F8FA"/>
  </g>
  <rect x="2000" y="165" width="8" height="245" rx="4" fill="#3370FF"/>
  <text x="2032" y="205" font-family="Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#3370FF">常态化演进</text>
  <text x="2032" y="253" font-family="Noto Sans SC, sans-serif" font-size="26" font-weight="700" fill="#1F2329">按统一链路持续扩展</text>
  <text x="2032" y="301" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#4E5969">新增业务命令与素材操作</text>
  <text x="2032" y="340" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#4E5969">持续修正运行边界与交付问题</text>
  <text x="2032" y="379" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#4E5969">依据调用记录完善命令与 Skill</text>
  <rect x="2000" y="440" width="380" height="120" rx="16" fill="#EAF2FF"/>
  <text x="2028" y="474" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#245BDB">阶段结果</text>
  <text x="2028" y="512" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="600" fill="#1F2329">持续承接素材编辑、数据查询与</text>
  <text x="2028" y="542" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="600" fill="#1F2329">自动化验证等新增需求</text>

  <!-- 主线说明 -->
  <text x="1300" y="1415" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="600" fill="#4E5969">统一入口　→　业务操作闭环　→　多环境与多业务复用　→　持续交付与观测　→　常态化扩展</text>
</svg>
