有面板引用</tspan></text><text x="40" y="112" font-size="30" font-family="PingFang SC,Arial,sans-serif" text-anchor="start" fill="#646a73" font-weight="400"><tspan x="40" dy="0">只更新指定引用，不把其他草稿编辑一起发布</tspan></text><rect x="65" y="250" width="1290" height="70" rx="10" fill="#f0f0f0" stroke="#d4b45b" stroke-width="2" /><text x="710" y="295.5" font-size="30" font-family="PingFang SC,Arial,sans-serif" text-anchor="middle" fill="#1f2329" font-weight="400"><tspan x="710" dy="0">前提：已确认面板范围，并取得成功搬运的旧 → 新素材映射</tspan></text><rect x="204" y="373" width="12" height="24" rx="0" fill="#ffffff" stroke="#718bae" stroke-width="2" /><rect x="654" y="373" width="12" height="24" rx="0" fill="#ffffff" stroke="#718bae" stroke-width="2" /><rect x="654" y="443" width="12" height="24" rx="0" fill="#ffffff" stroke="#718bae" stroke-width="2" /><rect x="204" y="443" width="12" height="24" rx="0" fill="#ffffff" stroke="#718bae" stroke-width="2" /><rect x="204" y="498" width="12" height="24" rx="0" fill="#ffffff" stroke="#718bae" stroke-width="2" /><rect x="204" y="554" width="12" height="24" rx="0" fill="#ffffff" stroke="#718bae" stroke-width="2" /><text x="48" y="681" font-size="34" font-family="PingFang SC,Arial,sans-serif" text-anchor="start" fill="#1f2329" font-weight="600"><tspan x="48" dy="0">同一事务：内容变化则不提交替换</tspan></text><rect x="204" y="718" width="12" height="24" rx="0" fill="#ffffff" stroke="#718bae" stroke-width="2" /><rect x="654" y="718" width="12" height="24" rx="0" fill="#ffffff" stroke="#718bae" stroke-width="2" /><rect x="654" y="783" width="12" height="24" rx="0" fill="#ffffff" stroke="#718bae" stroke-width="2" /><rect x="204" y="783" width="12" height="24" rx="0" fill="#ffffff" stroke="#718bae" stroke-width="2" /><rect x="204" y="913" width="12" height="24" rx="0" fill="#ffffff" stroke="#718bae" stroke-width="2" /><rect x="1154" y="913" width="12" height="24" rx="0" fill="#ffffff" stroke="#718bae" stroke-width="2" /><rect x="1154" y="978" width="12" height="24" rx="0" fill="#ffffff" stroke="#718bae" stroke-width="2" /><rect x="204" y="978" width="12" height="24" rx="0" fill="#ffffff" stroke="#718bae" stroke-width="2" /><text x="48" y="1091" font-size="34" font-family="PingFang SC,Arial,sans-serif" text-anchor="start" fill="#1f2329" font-weight="600"><tspan x="48" dy="0">只有草稿引用：完成替换，不发正式版</tspan></text><text x="48" y="1236" font-size="34" font-family="PingFang SC,Arial,sans-serif" text-anchor="start" fill="#1f2329" font-weight="600"><tspan x="48" dy="0">正式版也有旧引用：只发布替换差异</tspan></text><rect x="204" y="1273" width="12" height="24" rx="0" fill="#ffffff" stroke="#718bae" stroke-width="2" /><rect x="1154" y="1273" width="12" height="24" rx="0" fill="#ffffff" stroke="#718bae" stroke-width="2" /><rect x="1154" y="1343" width="12" height="24" rx="0" fill="#ffffff" stroke="#718bae" stroke-width="2" /><rect x="204" y="1343" width="12" height="24" rx="0" fill="#ffffff" stroke="#718bae" stroke-width="2" /><rect x="204" y="1398" width="12" height="24" rx="0" fill="#ffffff" stroke="#718bae" stroke-width="2" /><rect x="204" y="1454" width="12" height="24" rx="0" fill="#ffffff" stroke="#718bae" stroke-width="2" /><rect x="204" y="1503" width="12" height="24" rx="0" fill="#ffffff" stroke="#718bae" stroke-width="2" /><rect x="654" y="1503" width="12" height="24" rx="0" fill="#ffffff" stroke="#718bae" stroke-width="2" /><rect x="204" y="1613" width="12" height="24" rx="0" fill="#ffffff" stroke="#718bae" stroke-width="2" /><rect x="1154" y="1613" width="12" height="24" rx="0" fill="#ffffff" stroke="#718bae" stroke-width="2" /><rect x="204" y="1688" width="12" height="24" rx="0" fill="#ffffff" stroke="#718bae" stroke-width="2" /><rect x="654" y="1688" width="12" height="24" rx="0" fill="#ffffff" stroke="#718bae" stroke-width="2" /><rect x="654" y="1753" width="12" height="24" rx="0" fill="#ffffff" stroke="#718bae" stroke-width="2" /><rect x="204" y="1753" width="12" height="24" rx="0" fill="#ffffff" stroke="#718bae" stroke-width="2" /><text x="60" y="1850" font-size="30" font-family="PingFang SC,Arial,sans-serif" text-anchor="start" fill="#646a73" font-weight="400"><tspan x="60" dy="0">差异无法分离：保留草稿，停止自动发布</tspan></text><text x="60" y="1910" font-size="30" font-family="PingFang SC,Arial,sans-serif" text-anchor="start" fill="#646a73" font-weight="400"><tspan x="60" dy="0">发布响应未知先回读，不盲目重发；草稿是未发布编辑，正式版供客户端使用</tspan></text><rect x="235" y="345" width="400" height="35" fill="white" fill-opacity=".92"/><text x="435" y="375" font-size="30" font-family="PingFang SC,Arial,sans-serif" text-anchor="middle" fill="#1F2329">读取草稿、正式版及确认记录</text><rect x="295" y="415" width="280" height="35" fill="white" fill-opacity=".92"/><text x="435" y="445" font-size="30" font-family="PingFang SC,Arial,sans-serif" text-anchor="middle" fill="#1F2329">返回最新内容与指纹</text><rect x="178" y="526" width="250" height="35" fill="white" fill-opacity=".92"/><text x="303" y="556" font-size="30" font-family="PingFang SC,Arial,sans-serif" text-anchor="middle" fill="#1F2329">核对确认后未变化</text><rect x="220" y="690" width="430" height="35" fill="white" fill-opacity=".92"/><text x="435" y="720" font-size="30" font-family="PingFang SC,Arial,sans-serif" text-anchor="middle" fill="#1F2329">替换草稿引用＋操作记录＋回执</text><rect x="340" y="755" width="190" height="35" fill="white" fill-opacity=".92"/><text x="435" y="785" font-size="30" font-family="PingFang SC,Arial,sans-serif" text-anchor="middle" fill="#1F2329">事务提交完成</text><rect x="545" y="885" width="280" height="35" fill="white" fill-opacity=".92"/><text x="685" y="915" font-size="30" font-family="PingFang SC,Arial,sans-serif" text-anchor="middle" fill="#1F2329">构建并更新内测快照</text><rect x="605" y="950" width="160" height="35" fill="white" fill-opacity=".92"/><text x="685" y="980" font-size="30" font-family="PingFang SC,Arial,sans-serif" text-anchor="middle" fill="#1F2329">快照已更新</text><rect x="530" y="1245" width="310" height="35" fill="white" fill-opacity=".92"/><text x="685" y="1275" font-size="30" font-family="PingFang SC,Arial,sans-serif" text-anchor="middle" fill="#1F2329">选择替换差异并试合并</text><rect x="515" y="1315" width="340" height="35" fill="white" fill-opacity=".92"/><text x="685" y="1345" font-size="30" font-family="PingFang SC,Arial,sans-serif" text-anchor="middle" fill="#1F2329">返回试合并后的完整内容</text><rect x="118" y="1426" width="370" height="35" fill="white" fill-opacity=".92"/><text x="303" y="1456" font-size="30" font-family="PingFang SC,Arial,sans-serif" text-anchor="middle" fill="#1F2329">等于原正式版仅替换引用？</text><rect x="250" y="1475" width="370" height="35" fill="white" fill-opacity=".92"/><text x="435" y="1505" font-size="30" font-family="PingFang SC,Arial,sans-serif" text-anchor="middle" fill="#1F2329">可分离：先记录发布待确认</text><rect x="485" y="1585" width="400" height="35" fill="white" fill-opacity=".92"/><text x="685" y="1615" font-size="30" font-family="PingFang SC,Arial,sans-serif" text-anchor="middle" fill="#1F2329">按既有发布规则提交所选差异</text><rect x="265" y="1660" width="340" height="35" fill="white" fill-opacity=".92"/><text x="435" y="1690" font-size="30" font-family="PingFang SC,Arial,sans-serif" text-anchor="middle" fill="#1F2329">回读实际版本／审批结果</text><rect x="250" y="1725" width="370" height="35" fill="white" fill-opacity=".92"/><text x="435" y="1755" font-size="30" font-family="PingFang SC,Arial,sans-serif" text-anchor="middle" fill="#1F2329">记录成功、待审批或待确认</text></svg>