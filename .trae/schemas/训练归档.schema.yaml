version: 1
type: object
required:
  - module
  - date
  - summary
  - tags
properties:
  module:
    type: string
  date:
    type: string
  summary:
    type: string
  tags:
    type: object
    required:
      - mastered
      - need_review
      - new_learned
      - unknown
    properties:
      mastered:
        type: array
        items: { type: string }
      need_review:
        type: array
        items: { type: string }
      new_learned:
        type: array
        items: { type: string }
      unknown:
        type: array
        items: { type: string }
