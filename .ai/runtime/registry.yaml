version: 1
capabilities:
  intake-routing:
    path: .ai/capabilities/intake-routing.capability.md
    input_schema: .ai/schemas/题目清单.schema.yaml
    output_schema: .ai/schemas/题目清单.schema.yaml
  answer-coaching:
