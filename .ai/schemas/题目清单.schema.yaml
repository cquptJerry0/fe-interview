version: 1
type: object
required: [questions]
properties:
  questions:
    type: array
    items:
      type: object
      required: [id, title, type, tags]
      properties:
        id: { type: string }
        title: { type: string }
        type:
          type: string
          enum: ["八股", "场景", "开放", "手写", "编程"]
        difficulty:
          type: integer
          minimum: 1
          maximum: 5
        tags:
          type: array
          items: { type: string }
